<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#111C33"/>
      <stop offset="1" stop-color="#1A2B52"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(520 380) rotate(35) scale(520 340)">
      <stop stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1380 520) rotate(-20) scale(620 420)">
      <stop stop-color="#2563EB" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.55"/>

  <g filter="url(#soft)">
    <circle cx="520" cy="380" r="260" fill="url(#glow1)"/>
    <circle cx="1380" cy="520" r="320" fill="url(#glow2)"/>
  </g>

  <path d="M0 820C260 720 480 740 740 820C1040 915 1260 980 1920 920V1080H0V820Z" fill="rgba(255,255,255,0.04)"/>
  <path d="M0 900C320 820 560 840 820 910C1180 1005 1400 1060 1920 1010V1080H0V900Z" fill="rgba(255,255,255,0.03)"/>
</svg>

